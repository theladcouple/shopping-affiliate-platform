
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopSmart Admin Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #172033, #334155);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0003;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #172033;
    }

    .logo span {
      color: #f97316;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #f97316;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .notice {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="logo">Shop<span>Smart</span></div>
    <p class="subtitle">Administrator Login</p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input type="email" id="email" placeholder="Enter admin email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <button type="submit">Login to Dashboard</button>
    </form>

    <p class="notice">Secure administrator access</p>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Login security is being set up. Please wait for the next update.");
    });
  </script>

</body>
</html>
