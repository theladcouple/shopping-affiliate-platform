
<script>
  let challengeToken = null;

  document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = event.target;
    const button = form.querySelector("button");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    let message = document.getElementById("loginMessage");

    if (!message) {
      message = document.createElement("p");
      message.id = "loginMessage";
      message.style.marginTop = "18px";
      message.style.textAlign = "center";
      form.after(message);
    }

    button.disabled = true;
    message.style.color = "#64748b";

    try {
      if (challengeToken) {
        const otpInput = document.getElementById("totpCode");
        const code = otpInput.value;

        if (!/^\d{6}$/.test(code)) {
          throw new Error("Enter a valid 6-digit OTP.");
        }

        button.textContent = "Verifying OTP...";
        message.textContent = "Checking authenticator code...";

        const response = await fetch("/api/admin/totp-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            challenge_token: challengeToken,
            code
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "OTP verification failed");
        }

        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";

        window.location.href = "/admin/dashboard.html";
        return;
      }

      button.textContent = "Please wait...";
      message.textContent = "Checking login details...";

      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.error || "Login failed");
      }

      if (data.requires_totp) {
        challengeToken = data.challenge_token;

        const label = document.createElement("label");
        label.htmlFor = "totpCode";
        label.textContent = "Google Authenticator OTP";

        const input = document.createElement("input");
        input.id = "totpCode";
        input.type = "text";
        input.inputMode = "numeric";
        input.maxLength = 6;
        input.placeholder = "Enter 6-digit OTP";
        input.autocomplete = "one-time-code";
        input.required = true;

        form.insertBefore(label, button);
        form.insertBefore(input, button);

        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "").slice(0, 6);
        });

        document.getElementById("password").disabled = true;
        document.getElementById("email").disabled = true;

        message.textContent = "Enter your 6-digit authenticator code.";
        button.textContent = "Verify OTP";
        input.focus();
        button.disabled = false;
        return;
      }

      message.style.color = "green";
      message.textContent = "Login successful! Redirecting...";

      window.location.href = "/admin/dashboard.html";

    } catch (error) {
      message.style.color = "red";
      message.textContent = error.message || "Login failed.";
      button.disabled = false;
      button.textContent = challengeToken ? "Verify OTP" : "Login to Dashboard";
    }
  });
</script>
