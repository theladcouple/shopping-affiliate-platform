
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lad Couple Admin Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #172033, #334155);
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: white;
      padding: 38px;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0003;
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #172033;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus { border-color: #f97316; }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #f97316;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: 0.6; cursor: wait; }

    .notice {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="logo">The Lad Couple</div>
    <p class="subtitle">Administrator Login</p>

    <form id="loginForm">
      <label for="email">Admin Email</label>
      <input type="email" id="email" placeholder="Enter admin email" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <button type="submit">Login to Dashboard</button>
    </form>

    <p class="notice">Secure administrator access</p>
    <p id="loginMessage" style="margin-top:18px;text-align:center;" role="status"></p>
  </main>

  <script>
    let challengeToken = null;

    document.getElementById("loginForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const form = event.currentTarget;
      const button = form.querySelector("button");
      const message = document.getElementById("loginMessage");

      button.disabled = true;
      message.style.color = "#64748b";

      try {
        if (challengeToken) {
          const code = document.getElementById("totpCode").value;

          if (!/^\d{6}$/.test(code)) {
            throw new Error("Enter a valid 6-digit OTP.");
          }

          button.textContent = "Verifying OTP...";
          message.textContent = "Checking authenticator code...";

          const response = await fetch("/api/admin/totp-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "same-origin",
            body: JSON.stringify({
              challenge_token: challengeToken,
              code
            })
          });

          const data = await response.json();

          if (!response.ok || !data.success) {
            throw new Error(data.error || "OTP verification failed");
          }

          message.style.color = "green";
          message.textContent = "Login successful! Redirecting...";
          window.location.href = "/admin/dashboard.html";
          return;
        }

        button.textContent = "Please wait...";
        message.textContent = "Checking login details...";

        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Login failed");
        }

        if (data.requires_totp) {
          challengeToken = data.challenge_token;

          const label = document.createElement("label");
          label.htmlFor = "totpCode";
          label.textContent = "Google Authenticator OTP";

          const input = document.createElement("input");
          input.id = "totpCode";
          input.type = "text";
          input.inputMode = "numeric";
          input.maxLength = 6;
          input.placeholder = "Enter 6-digit OTP";
          input.autocomplete = "one-time-code";
          input.required = true;

          form.insertBefore(label, button);
          form.insertBefore(input, button);

          input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "").slice(0, 6);
          });

          document.getElementById("email").disabled = true;
          document.getElementById("password").disabled = true;

          message.textContent = "Enter your 6-digit authenticator code.";
          button.textContent = "Verify OTP";
          input.focus();
          button.disabled = false;
          return;
        }

        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";
        window.location.href = "/admin/dashboard.html";

      } catch (error) {
        message.style.color = "red";
        message.textContent = error.message || "Login failed.";
        button.disabled = false;
        button.textContent = challengeToken ? "Verify OTP" : "Login to Dashboard";
      }
    });
  </script>
</body>
</html>
