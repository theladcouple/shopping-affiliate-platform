
<script>
  document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const form = event.target;
    const button = form.querySelector("button");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    let message = document.getElementById("loginMessage");

    if (!message) {
      message = document.createElement("p");
      message.id = "loginMessage";
      message.style.marginTop = "18px";
      message.style.textAlign = "center";
      form.after(message);
    }

    button.disabled = true;
    button.textContent = "Please wait...";
    message.style.color = "#64748b";
    message.textContent = "Checking login details...";

    try {
      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(data.error || "Login failed");
      }

      if (data.requires_totp) {
        let otpInput = document.getElementById("totpCode");

        if (!otpInput) {
          const label = document.createElement("label");
          label.textContent = "Google Authenticator OTP";
          label.htmlFor = "totpCode";

          otpInput = document.createElement("input");
          otpInput.id = "totpCode";
          otpInput.type = "text";
          otpInput.inputMode = "numeric";
          otpInput.maxLength = 6;
          otpInput.placeholder = "Enter 6-digit OTP";
          otpInput.autocomplete = "one-time-code";
          otpInput.required = true;

          form.insertBefore(label, button);
          form.insertBefore(otpInput, button);
        }

        otpInput.value = "";
        otpInput.focus();
        otpInput.addEventListener("input", () => {
          otpInput.value = otpInput.value.replace(/\D/g, "").slice(0, 6);
        });

        message.textContent = "Enter your Google Authenticator OTP.";
        button.textContent = "Verify OTP";
        button.disabled = false;

        form.onsubmit = async function(otpEvent) {
          otpEvent.preventDefault();

          const code = otpInput.value;

          if (!/^\d{6}$/.test(code)) {
            message.style.color = "red";
            message.textContent = "Enter a valid 6-digit OTP.";
            return;
          }

          button.disabled = true;
          button.textContent = "Verifying...";

          try {
            const otpResponse = await fetch("/api/admin/totp-login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({
                challenge_token: data.challenge_token,
                code
              })
            });

            const otpData = await otpResponse.json();

            if (!otpResponse.ok || !otpData.success) {
              throw new Error(otpData.error || "OTP verification failed");
            }

            message.style.color = "green";
            message.textContent = "Login successful! Redirecting...";

            window.location.href = "/admin/dashboard.html";

          } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
            button.disabled = false;
            button.textContent = "Verify OTP";
          }
        };

        return;
      }

      message.style.color = "green";
      message.textContent = "Login successful! Redirecting to dashboard...";

      form.reset();

      setTimeout(() => {
        window.location.href = "/admin/dashboard.html";
      }, 500);

    } catch (error) {
      message.style.color = "red";
      message.textContent = error.message || "Unable to connect. Please try again.";
      button.disabled = false;
      button.textContent = "Login to Dashboard";
    }
  });
</script>
